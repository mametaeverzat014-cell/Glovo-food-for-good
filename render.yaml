# Render Blueprint for the FoodSave backend.
# In the Render dashboard: New + > Blueprint, point it at this repo, and it
# provisions the API service and a PostgreSQL database automatically.
services:
  - type: web
    name: foodsave-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodsave-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set this to your deployed Vercel URL, e.g. https://foodsave.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Same Vercel URL — used for Stripe success/cancel redirects.
      - key: WEB_URL
        sync: false
      # Stripe test secret key (sk_test_...) from dashboard.stripe.com/test/apikeys
      - key: STRIPE_SECRET_KEY
        sync: false
      # AI offer assistant works with no key (built-in generator). Optional:
      # add a FREE Groq key (console.groq.com) for LLM-quality copy.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

databases:
  - name: foodsave-db
    plan: free
